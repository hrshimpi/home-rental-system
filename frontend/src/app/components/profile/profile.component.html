
<div class="page">
  @if (user !== undefined) {
    <mat-card>
      <mat-card-header>
        <mat-card-title>Profile</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p><a [routerLink]="['/my-chats', user._id]" routerLinkActive="router-link-active">My chats</a></p>
        <p>Name: {{ user.name }}</p>
        <p>Email: {{ user.email }}</p>
        <p>Mobile: {{ user.mobile }}</p>
      </mat-card-content>
    </mat-card>
  }
</div>
