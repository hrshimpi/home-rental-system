
<div class="container">
  @if (user !== undefined) {
    <div class="row">
      <h2>Profile</h2>
      <h2>
        <a [routerLink]="['/my-chats', user._id]" routerLinkActive="router-link-active" >My chats</a>
      </h2>
      <br>
        <h5>Name:  {{ user.name }}</h5>
        <h5>Email: {{ user.email }}</h5>
        <h5>Mobile:{{ user.mobile }}</h5>
      </div>
    }
  </div>
