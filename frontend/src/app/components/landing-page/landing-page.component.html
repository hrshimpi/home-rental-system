<div class="page search-page">
  <mat-radio-group class="type-toggle">
    <mat-radio-button value="home">Home</mat-radio-button>
    <mat-radio-button value="pg" checked>PG/Hostel</mat-radio-button>
  </mat-radio-group>

  <mat-form-field appearance="outline" class="landmark-field">
    <mat-label>Search landmark...</mat-label>
    <input matInput placeholder="Search landmark...">
  </mat-form-field>

  <div class="search-row">
    <mat-form-field appearance="outline">
      <mat-label>Search for a city</mat-label>
      <input
        matInput
        type="text"
        id="typeahead-focus"
        [(ngModel)]="model"
        (ngModelChange)="filterCities()"
        [matAutocomplete]="cityAuto"
        />
      <mat-autocomplete #cityAuto="matAutocomplete">
        @for (city of filteredCities; track city) {
          <mat-option [value]="city">{{ city }}</mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>For</mat-label>
      <mat-select [(ngModel)]="selectedValue">
        @for (value of dropdownValues; track value) {
          <mat-option [value]="value">{{ value }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Select Room Sharing type</mat-label>
      <mat-select [(ngModel)]="selectedValue2">
        @for (value of dropdownValues2; track value) {
          <mat-option [value]="value">{{ value }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
</div>
