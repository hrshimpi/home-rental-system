<header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between p-3 mb-4 border-bottom">
	<div class="col-md-3 mb-2 mb-md-0">
	  <a class="navbar-brand" [routerLink]="'/'" class="d-inline-flex link-body-emphasis text-decoration-none">
		<span>Find Me Home</span>
	  </a>
	</div>

	<ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
	  <li><a href="#" class="nav-link px-2" [routerLink]="'/myProperties'"   *ngIf="role === 'owner'">My Properties</a></li>
	  <li><a href="#" class="nav-link px-2" [routerLink]="'/allProperties'">All properties</a></li>
	  <li><a href="#" class="nav-link px-2" [routerLink]="['/my-chats', id]" *ngIf="id">My Chats</a></li>
	  <li><a href="#" class="nav-link px-2" [routerLink]="'/profile'" *ngIf="id">Profile</a></li>
	  <li><a href="#" class="nav-link px-2" [routerLink]="'/addProperty'"  *ngIf="role === 'owner'">Post Your Property</a></li>
	  <!-- <li>				
		{{ isUserLoggedIn }}, 
	  </li> -->
	</ul>

	<div class="col-md-3 text-end">
	  <button type="button" class="btn btn-outline-primary me-2"  [routerLink]="'/login'" *ngIf="!id" >Login</button>
	  <button type="button" class="btn btn-primary" [routerLink]="'/signUp'"  *ngIf="!id" >Sign-up</button>
	  <button type="button"  class="btn btn-primary" (click)="logoutFromHeader()" *ngIf="id">Logout</button>
	</div>
</header>
