<mat-toolbar class="app-header">
  <a class="brand" [routerLink]="'/'">Find Me Home</a>

  <nav class="nav-links">
    @if (role === 'owner') {
      <a mat-button [routerLink]="'/myProperties'">My Properties</a>
    }
    <a mat-button [routerLink]="'/allProperties'">All properties</a>
    @if (id) {
      <a mat-button [routerLink]="['/my-chats', id]">My Chats</a>
    }
    @if (id) {
      <a mat-button [routerLink]="'/profile'">Profile</a>
    }
    @if (role === 'owner') {
      <a mat-button [routerLink]="'/addProperty'">Post Your Property</a>
    }
  </nav>

  <span class="spacer"></span>

  <div class="auth-actions">
    @if (!id) {
      <a mat-stroked-button [routerLink]="'/login'">Login</a>
    }
    @if (!id) {
      <a mat-flat-button [routerLink]="'/signUp'">Sign-up</a>
    }
    @if (id) {
      <button mat-flat-button (click)="logoutFromHeader()">Logout</button>
    }
  </div>
</mat-toolbar>
